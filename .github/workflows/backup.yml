name: Daily Backup

# ⏸️ ปิดการรันอัตโนมัติแล้ว (30 ก.ค. 2569) — เหลือกดรันเองเท่านั้น
#
# เหตุผล: อาศัย Supabase daily backup ของแพลตฟอร์มแทน (Free tier เก็บย้อนหลัง 7 วัน)
# เปิดกลับ: เอาคอมเมนต์ 2 บรรทัด schedule/cron ออก
#
# ⚠️ ก่อนเปิดกลับ ต้องแก้ 2 จุดที่ทำให้ workflow นี้ไม่เคยสำเร็จ:
#   1. job backup-database — ชื่อ artifact ใส่ $(date +%Y%m%d) ใน with: ซึ่งไม่ใช่ shell
#      จึงไม่ถูกแทนค่า และอักขระ ( ) % เป็นอักขระต้องห้ามของ upload-artifact v4
#      แก้เป็น: name: db-backup-${{ github.run_id }}
#   2. src/app/api/backup/route.ts — ดึงแค่ projects/researchers/staff/sites
#      ยังขาด activities · kpi_targets · rpf_faculties · rpf_initiatives ·
#      rpf_kpi_catalog · research_briefs · activity_reports · project_tokens · team_members

on:
  # schedule:
  #   - cron: '0 1 * * *' # ทุกวัน 08:00 น. ไทย (01:00 UTC)
  workflow_dispatch:     # กด run manually ได้

jobs:
  backup-database:
    name: Backup Supabase DB
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump database
        run: |
          pg_dump "${{ secrets.DATABASE_URL }}" \
            --no-owner --no-privileges \
            --format=custom \
            --file=rpf-backup-$(date +%Y%m%d).dump
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Upload DB dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}-$(date +%Y%m%d)
          path: rpf-backup-*.dump
          retention-days: 30

  backup-json:
    name: Backup Data as JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export projects JSON
        run: |
          mkdir -p backups
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.BACKUP_SECRET }}" \
            "${{ secrets.APP_URL }}/api/backup" \
            -o backups/projects-$(date +%Y%m%d).json
          echo "Exported $(cat backups/projects-$(date +%Y%m%d).json | wc -c) bytes"

      - name: Commit backup to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "chore: daily backup $(date +%Y-%m-%d)"
          git push
